<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campfire Tales</title>
<style>
  :root { --ink: #fff4e3; --dim: #c9b9a3; --ember: #ffb347; --flame: #ff7a2f; --panel: #1a1424e6; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b1030; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  #story { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); box-sizing: border-box; max-height: 38vh; overflow: auto; padding: 12px 16px; border-radius: 18px; background: var(--panel); border: 1px solid #ffb34733; box-shadow: 0 0 40px #ff7a2f22; }
  #story:empty { display: none; }
  #story .twist { display: inline-block; margin-bottom: 6px; padding: 3px 10px; border-radius: 999px; background: #8a5cff44; color: #e6dcff; font-weight: 800; font-size: 13px; }
  #story .title { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--ember); text-transform: uppercase; margin-bottom: 4px; }
  #text { font: 21px/1.5 Georgia, "Times New Roman", serif; }
  #text span { border-bottom: 2px solid transparent; padding: 0 1px; border-radius: 4px; transition: background .3s, color .3s; }
  #text span.new { animation: pop .5s ease-out; color: #fff; text-shadow: 0 0 12px #ffb347; }
  #text span.lit { background: #ffb34755; color: #fff; }
  #text span.fire { color: #ffcf8a; font-style: italic; }
  #text button { border: 0; background: #ffffff10; border-radius: 6px; padding: 2px 4px; margin: 1px 0; font: 21px/1.4 Georgia, serif; border-bottom: 2px solid transparent; }
  #text button.mine { opacity: .45; cursor: default; }
  #text button.on { background: #ffb347; color: #2a1600; }
  #text button i { font-style: normal; font-size: 12px; font-weight: 800; color: var(--ember); margin-left: 3px; font-family: system-ui, sans-serif; }
  #text button.on i { color: #2a1600; }
  @keyframes pop { 0% { transform: scale(1.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #text span, #text button { display: inline-block; }
  @media (max-width: 600px) { #text, #text button { font-size: 18px; } }
  body.attract #text { font-size: 30px; } body.attract #story { width: min(860px, calc(100vw - 24px)); }
  #big { position: fixed; left: 0; right: 0; top: 44%; text-align: center; pointer-events: none; padding: 0 16px; text-shadow: 0 2px 10px #000; }
  #big:empty { display: none; }
  #big b { display: block; font: 900 clamp(26px, 6vw, 44px)/1.1 Georgia, serif; color: var(--ember); }
  #big small { display: block; font-size: 15px; font-weight: 700; color: var(--dim); margin-top: 4px; }
  #turn { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(560px, calc(100vw - 24px)); box-sizing: border-box; padding: 10px 12px; border-radius: 18px; background: var(--panel); border: 1px solid #ffffff22; }
  #turnQ { font-weight: 800; margin-bottom: 6px; text-align: center; }
  #bar { height: 6px; border-radius: 3px; background: #ffffff1a; overflow: hidden; margin-bottom: 8px; } #bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--flame)); transform-origin: left; }
  #mine { display: flex; gap: 8px; } #mine[hidden] { display: none; }
  #say { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 2px solid #ffb34766; background: #0006; color: #fff; padding: 0 12px; font: 18px Georgia, serif; user-select: text; -webkit-user-select: text; }
  #send { min-width: 80px; height: 48px; border: 0; border-radius: 12px; background: var(--flame); color: #fff; font-weight: 800; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: center; }
  #chips button { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 2px solid #ffffff22; background: #ffffff12; font: 16px Georgia, serif; }
  #net { position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--dim); pointer-events: none; text-shadow: 0 1px 3px #000; }
  #tools { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  #tools button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid #ffffff33; background: var(--panel); font-size: 20px; }
  body.turning #tools, body.turning #net { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 185px); }
  .sheet { position: fixed; inset: 0; display: grid; place-items: center; background: #000a; padding: 16px; box-sizing: border-box; }
  .card { box-sizing: border-box; width: min(420px, calc(100vw - 32px)); max-height: 84vh; overflow: auto; padding: 16px 18px; border-radius: 18px; background: #1d1626; border: 1px solid #ffb34744; box-shadow: 0 0 60px #ff7a2f33; }
  .card h2 { margin: 0 0 4px; font: 900 24px Georgia, serif; color: var(--ember); text-align: center; }
  .card .sub { margin: 0 0 8px; color: var(--dim); font-size: 14px; text-align: center; }
  .card h3 { margin: 12px 0 4px; font-size: 12px; color: var(--ember); text-transform: uppercase; letter-spacing: .08em; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; } .card li span { float: right; font-weight: 800; color: var(--ember); } .card li.me { color: var(--ember); }
  .card p { margin: 8px 0 0; font-size: 13px; opacity: .8; text-align: center; }
  .card .row { display: flex; gap: 8px; margin-top: 10px; } .card .row button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid #ffffff33; background: #ffffff12; font-weight: 800; }
  button.big { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--flame); color: #fff; font-weight: 800; font-size: 17px; }
  .tale { padding: 8px 10px; border-radius: 12px; background: #ffffff0c; margin-top: 8px; }
  .tale b { display: block; font-size: 13px; color: var(--ember); } .tale div { font: 15px/1.45 Georgia, serif; margin: 2px 0 6px; }
  .tale button { min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #ffffff33; background: #ffffff10; font-size: 13px; font-weight: 700; margin-right: 6px; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="story"></div>
<div id="big"></div>
<div id="turn" hidden>
  <div id="turnQ"></div><div id="bar"><i></i></div>
  <div id="mine" hidden><input id="say" maxlength="24" placeholder="Add a word or two…" autocomplete="off" enterkeyhint="send"><button id="send">Add</button></div>
  <div id="chips"></div>
</div>
<div id="net"></div>
<div id="tools"><button id="voiceBtn" title="Read stories aloud">🔊</button><button id="logBtn" title="Story log">📜</button></div>
<div class="sheet" id="over" hidden><div class="card">
  <h2 id="bestT"></h2><div class="sub" id="bestSub"></div>
  <h3>Votes this story</h3><ol id="scores"></ol>
  <div class="row"><button id="saveBtn">💾 Save story</button><button id="shareBtn">📤 Share</button></div>
  <h3>Most-loved storytellers</h3><ol id="board"><li>Loading…</li></ol>
  <button class="big" id="again">Next story</button><p id="next"></p>
</div></div>
<div class="sheet" id="logPanel" hidden><div class="card">
  <h2>Story log</h2><div class="sub">This fire's last stories, and the ones you saved.</div>
  <div id="logList"></div>
  <button class="big" id="logClose">Back to the fire</button>
</div></div>
<script>
/* ═══ CAMPFIRE TALES · a Multiplayer Agent starter ═════════════════════════════════════
 * Around a campfire at night, everyone builds one story together, a word (or two) each,
 * in turn, against a timer. Now and then the fire throws in a twist ("now a villain
 * appears"). At the end the story is read aloud while the words light up, and everyone
 * votes for the best word. Party, 2–10 players; bot storytellers fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, story length, how often twists come, bots
 *   WORDS ......... the little grammar bots (and your suggestion chips) use, the twists
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   STORY (HOST) .. the phases (gather, tell, read, vote, done), whose turn it is, twists,
 *                   bot words, the vote count, the room's story log. Only the host writes these.
 *   ME ............ adding your word, voting, saving and sharing stories
 *   SCREEN ........ the story card, the turn bar, results, the story log
 *   CAMPFIRE ...... drawing the night: sky, trees, the fire and sparks, everyone sitting round
 *   SOUND ......... crackle and pops (WebAudio) and reading the story aloud (speech synthesis)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The story lives in ONE shared field, `game`: {id, v, phase, order (who sits round the
 *     fire, in turn order), tn (whose turn), turnAt, endsAt, words [[text, who]], tw (the
 *     current twist), readAt, ms (per word when read aloud), votes}. Only the HOST writes it;
 *     `v` goes up on every write. Timers are timestamps, so a new host carries straight on.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It also plays the bots and writes `log` (the last few stories).
 *   - Your word is an intent: mp.send("word", {id, n, w}) to the host, which checks it's your
 *     turn (n = how many words the story had) and adds it. The host adds its own directly.
 *     If a turn runs out, the fire whispers a word instead, and the story moves on.
 *   - Each player writes its OWN entity: `vote` {r, w} (story id, which word), `rdy` (next
 *     story), `hb` (heartbeat) once a second and `n`/`c` (name, color).
 *   - ?attract plays offline with bots only and quick turns (the preview is recorded from it).
 *   - Leaderboard "story-votes": the most votes a player's words got in one story.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
var CONFIG = {
  seats: 5,             // bot storytellers fill the circle up to this many
  gatherMs: 5000,       // ms before a story starts
  turnMs: 15000,        // ms you get to add your word
  botMs: [1400, 3800],  // a bot thinks this long before adding its word
  wordsPer: 4,          // each storyteller adds about this many words...
  minWords: 18, maxWords: 30, // ...but a story is always this long
  twistEvery: 7,        // a twist every this many words
  readMs: 430,          // ms per word when the story is read aloud
  voteMs: 15000,        // ms to vote for the best word
  doneMs: 15000,        // ms on the results before the next story
  maxLen: 24,           // longest word or phrase you can add (characters, up to 3 words)
  logSize: 4,           // stories the room keeps in its log
  board: "story-votes",
};
var BOT_NAMES = ["Old Moss", "Juniper", "Captain Pip", "Willow", "Bramble", "Toast", "Ember", "Hazel"];
var COLORS = ["#ff7a59", "#5ec8ff", "#ffd166", "#8be27b", "#c48cff", "#ff8fc7", "#56e0c8", "#ffa94d", "#a3b4ff", "#ff6b6b"];
var NAME_A = ["Cozy", "Sleepy", "Brave", "Silly", "Sparky", "Quiet"], NAME_B = ["Owl", "Fox", "Bear", "Moth", "Raccoon", "Badger"];

// ── WORDS ───────────────────────────────────────────────────────────────────────────
// Pieces of a story by what can come next. Bots pick from these; you see three as chips.
var LEX = {
  open: ["Once upon a time,", "One foggy night,", "Long ago,", "Deep in the woods,", "Last summer,"],
  det: ["a", "the", "my", "an old", "one"],
  adj: ["sleepy", "grumpy", "tiny", "enormous", "sparkly", "nervous", "hairy", "invisible", "very polite", "soggy", "glowing", "suspicious"],
  noun: ["bear", "wizard", "pancake", "raccoon", "ghost", "grandma", "moose", "robot", "frog", "pirate", "marshmallow", "canoe", "squirrel", "tent"],
  np: ["a sleepy bear", "the old wizard", "a talking moose", "my grumpy uncle", "a tiny dragon", "the camp cook", "a lost robot", "a giant marshmallow", "the moon", "a nervous ghost"],
  vp: ["tripped", "sang loudly", "found a map", "sneezed", "whispered", "danced", "ran away", "ate everything", "fell asleep", "built a raft", "lost a sock", "started laughing", "hid", "yelled"],
  pp: ["into the lake", "under a log", "with a spoon", "behind the tent", "on the moon", "across the river", "up a tree", "in the dark"],
  conj: ["and then", "but", "so", "until", "because"],
  start: ["Then", "Suddenly,", "Meanwhile,", "Later,", "But", "Luckily,"],
  end: [".", "!", "...", "for no reason.", "forever."],
};
// What can follow what (the grammar), and how bots guess what a word you typed is.
var NEXT = { begin: ["open", "open", "np"], open: ["np", "det"], start: ["np", "det"], det: ["adj", "noun"], adj: ["noun"], noun: ["vp"], np: ["vp", "vp", "who"], who: ["vp"], vp: ["pp", "np", "end", "conj"], pp: ["end", "conj", "end"], conj: ["np", "det", "vp"], end: ["start"] };
LEX.who = ["who", "and"];
var TWISTS = [
  { say: "Now a villain appears!", np: ["a villain", "the evil queen", "a sneaky goblin", "the Shadow Baker"] },
  { say: "Suddenly it starts to storm!", np: ["a storm", "the thunder", "a soggy cloud"], vp: ["got soaked", "ran for cover"] },
  { say: "Someone finds a secret door!", np: ["a secret door", "a hidden tunnel", "a trapdoor"], vp: ["opened it", "knocked twice"] },
  { say: "Add a sound effect!", np: ["KABOOM!", "a loud BONK", "SPLASH!", "a tiny squeak"] },
  { say: "Somebody falls in love!", vp: ["fell in love", "blushed", "wrote a poem"], np: ["a handsome toad", "true love"] },
  { say: "A giant shows up!", np: ["a giant", "an enormous foot", "a very tall stranger"] },
  { say: "Something magical happens!", vp: ["turned into a frog", "started to float", "glowed purple"], np: ["a magic spell", "a wish"] },
];
var WRAP = { say: "Wrap it up! The story ends soon.", vp: ["went home", "lived happily ever after", "never camped again"], end: ["happily ever after.", "and that was that.", "forever."] };
var DETS = ["a", "an", "the", "my", "his", "her", "their", "our", "some", "one", "every", "your"];
var PREPS = ["into", "under", "with", "on", "behind", "across", "over", "through", "to", "at", "in", "near", "inside", "from"];
/** What kind of piece a word or phrase is (its last word decides), so bots know what can follow. */
function kindOf(text) {
  var t = String(text || "").trim(), lw = t.toLowerCase().split(/\s+/).pop() || "";
  if (!t) return "begin";
  for (var k of ["open", "start", "np", "vp", "pp", "conj", "adj", "noun", "end"]) if (LEX[k].some(function (x) { return x.toLowerCase() === t.toLowerCase(); })) return k;
  if (/[.!?]$/.test(t)) return "end";
  if (/,$/.test(t)) return "start";
  if (DETS.indexOf(lw) >= 0) return "det";
  if (PREPS.indexOf(lw) >= 0) return "det"; // "into" wants "the …" next, like a determiner would
  if (LEX.conj.indexOf(lw) >= 0 || lw === "and" || lw === "then") return "conj";
  if (LEX.adj.indexOf(lw) >= 0 || /(y|ful|ous|ish|less)$/.test(lw)) return "adj";
  if (/(ed|ing)$/.test(lw)) return "vp";
  return "noun"; // anything else: treat it like a thing or a name
}
/** A few pieces that could come next after `words` (with the current twist's words first). */
function suggest(words, twist, rnd, n) {
  var lastText = words.length ? words[words.length - 1][0] : "", kinds = NEXT[kindOf(lastText)] || ["np"], out = [];
  for (var g = 0; g < 30 && out.length < n; g++) {
    var k = kinds[Math.floor(rnd() * kinds.length)], pool = (twist && twist[k] && rnd() < 0.7 ? twist[k] : LEX[k]) || LEX.np;
    var w = pool[Math.floor(rnd() * pool.length)];
    if (k === "end" && /[.!?]$/.test(lastText)) continue;
    if (out.indexOf(w) < 0) out.push(w);
  }
  return out;
}
/** Tidy a word someone typed: trim, at most three words, at most CONFIG.maxLen characters. */
function clean(w) { return String(w || "").replace(/[<>{}[\]\\]/g, "").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ").slice(0, CONFIG.maxLen); }

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'campfire-tales',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
var QS = new URLSearchParams(location.search), ATTRACT = QS.has("attract");
if (ATTRACT) document.body.classList.add("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 6, gatherMs: 300, botMs: [450, 800], minWords: 14, maxWords: 14, twistEvery: 5, readMs: 230, voteMs: 2500, doneMs: 2500 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  var id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [], queued = false;
  var emit = function () { if (!queued) { queued = true; queueMicrotask(function () { queued = false; subs.forEach(function (f) { f(state); }); }); } };
  var put = function (o, k, v) { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state: state, offline: true,
    me: { set: function (k, v) { put(state.entities.players[id], k, v); } },
    setShared: function (k, v) { put(state.shared, k, v); },
    onState: function (f) { subs.push(f); f(state); }, onJoin: function () {}, onLeave: function () {}, on: function () {}, send: function () {},
    onDisconnect: function () {}, onReconnect: function () {}, leave: async function () {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    var mp = await Promise.race([MP.join(Object.assign({}, MP_CONNECT)), new Promise(function (_, no) { setTimeout(function () { no(new Error("timed out")); }, 10000); })]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
function parse(v, fb) { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch (e) { return fb; } }
var memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { var m = memo.get(key); if (m && m.raw === raw) return m.v; var v = parse(raw, fb); memo.set(key, { raw: raw, v: v }); return v; }
var net = null, S = { entities: { players: {} }, shared: {} }, netDown = false;
var seenHb = new Map();
function livePlayers() {
  var now = performance.now(), out = [];
  for (var [id, p] of Object.entries(S.entities.players || {})) {
    var s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
var hostHold = 0, lastTick = performance.now(); // after a freeze, no hosting before hostHold (see frame())
function isHost() { return performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ── STORY (HOST) ────────────────────────────────────────────────────────────────────
var host = { last: null, was: false, botAt: 0, botFor: "" };
/** The story as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() { var g = cached("game", S.shared.game, null); return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g; }
function writeGame(g) { var cur = cached("game", S.shared.game, null); g = Object.assign({}, g, { v: Math.max(game() ? game().v : 0, cur ? cur.v : 0) + 1 }); host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
function humans() { return livePlayers().filter(function (id) { return !(ATTRACT && id !== net.sessionId); }); }
function nameOf(id) { if (id === net.sessionId) return myName; var p = S.entities.players[id]; return String((p && p.n) || "Player"); }
function colorOf(id) { if (id === net.sessionId) return myColor; var p = S.entities.players[id]; return (p && p.c) || "#ccc"; }
/** A new story: everyone here (humans, then bots to fill the circle) sits round the fire in a random order. */
function newStory(id) {
  var people = humans().map(function (h) { return [h, nameOf(h).slice(0, 14), colorOf(h)]; }), want = Math.max(0, CONFIG.seats - people.length);
  var names = BOT_NAMES.slice().sort(function () { return Math.random() - 0.5; }), used = new Set(people.map(function (p) { return p[2]; })), free = COLORS.filter(function (c) { return !used.has(c); });
  for (var i = 0; i < want; i++) people.push(["bot" + i, names[i], free[i] || COLORS[i]]);
  people.sort(function () { return Math.random() - 0.5; });
  var target = Math.max(CONFIG.minWords, Math.min(CONFIG.maxWords, people.length * CONFIG.wordsPer));
  return { id: id, phase: "gather", order: people, tn: 0, turnAt: 0, endsAt: Date.now() + CONFIG.gatherMs, words: [], target: target, tw: -1, twists: [], seed: (Math.random() * 1e9) | 0, readAt: 0, ms: CONFIG.readMs, votes: {} };
}
var isBot = function (id) { return String(id).indexOf("bot") === 0; };
/** Add a word for the storyteller at seat `who` (-1 = the fire), then pass the turn and maybe throw in a twist. */
function addWord(g, w, who) {
  var G = Object.assign({}, g, { words: g.words.concat([[w, who]]) }), n = G.words.length, t = Date.now();
  if (n >= G.target) return Object.assign(G, { phase: "read", readAt: t + 1200, endsAt: t + 1200 + n * G.ms + 2500, tn: -1 });
  if (n === G.target - 3) G.tw = 99; // the last stretch: wrap it up
  else if (n % CONFIG.twistEvery === 0) { var r = mulberry32(G.seed + n); G.tw = Math.floor(r() * TWISTS.length); G.twists = G.twists.concat([n]); }
  return Object.assign(G, nextTurn(G, (g.tn + 1) % G.order.length), {});
}
function nextTurn(G, tn) { var t = Date.now(); return { tn: tn, turnAt: t, endsAt: t + CONFIG.turnMs }; }
var twistOf = function (g) { return g.tw === 99 ? WRAP : g.tw >= 0 ? TWISTS[g.tw] : null; };

function drawTeller(p, t) {

  ctx.fillStyle = "#3d2618"; ctx.beginPath(); ctx.roundRect(x - 34 * s, p.y - 2 * s, 68 * s, 12 * s, 6 * s); ctx.fill(); // the log they sit on
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.ellipse(x, y - 26 * s, 24 * s, 28 * s, 0, 0, 7); ctx.fill();

var bubbles = new Map(); // seat -> { w, at } on our clock

// ── SOUND ───────────────────────────────────────────────────────────────────────────
var AC = null, noiseBuf = null, nextCrackle = 0;

  try { AC = new AudioContext(); noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) { AC = null; }

function hiss(len, vol, hp) { if (!AC) return; var t0 = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = hp; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len); s.connect(f).connect(g).connect(AC.destination); s.start(t0, Math.random() * 0.8); s.stop(t0 + len + 0.02); }

}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
var last = performance.now(), lastHb = 0, lastUi = 0, prev = null;

(async function start() {
